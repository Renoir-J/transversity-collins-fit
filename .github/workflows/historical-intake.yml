name: Historical source intake

on:
  pull_request:
    paths:
      - config/historical-sources.json
      - config/historical-data-contract.json
      - src/collinsflow/historical.py
      - src/collinsflow/experimental.py
      - src/collinsflow/cli.py
      - src/collinsflow/provenance.py
      - workflow/historical-intake.smk
      - scripts/check_cached_historical.py
      - pyproject.toml
      - requirements.lock
      - .github/workflows/historical-intake.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intake:
    name: locked historical candidates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Acquire, normalize and cross-check historical sources
        run: |
          snakemake --snakefile workflow/historical-intake.smk --cores 1 --config output=runs/historical-intake
          python scripts/check_cached_historical.py config/historical-sources.json data/raw/historical runs/historical-intake
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: historical-intake-${{ github.sha }}
          path: runs/historical-intake
          retention-days: 30
