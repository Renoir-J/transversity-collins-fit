name: Parton input references

on:
  pull_request:
    paths:
      - config/parton-*.json
      - bridges/**
      - fortran/check_dss*.f90
      - numerics/**
      - src/collinsflow/parton.py
      - src/collinsflow/experimental.py
      - src/collinsflow/provenance.py
      - scripts/prepare_parton_inputs.py
      - .github/workflows/parton-inputs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parton-inputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inputs:
    name: locked PDF and FF references
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          delete-old-caches: 'false'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          julia --project=numerics -e 'using Pkg; Pkg.instantiate()'
      - name: Build unmodified locked source references
        run: python scripts/prepare_parton_inputs.py
      - name: Compare native interfaces and explicit range policies
        run: julia --project=numerics numerics/bin/check_parton_inputs.jl .runtime/parton-inputs/build.json runs/ci-parton/validation.json
      - name: Upload input comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parton-inputs-${{ github.sha }}
          path: |
            runs/ci-parton
            .runtime/parton-inputs/build.json
            .runtime/parton-inputs/build.log
          include-hidden-files: true
          retention-days: 30
