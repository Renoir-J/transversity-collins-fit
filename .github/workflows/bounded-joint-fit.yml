name: Bounded joint fitting

on:
  pull_request:
    paths:
      - config/*-contract.json
      - numerics/**
      - workflow/bounded-joint-fit.smk
      - scripts/check_cached_bounded_workflow.py
      - requirements.lock
      - .github/workflows/bounded-joint-fit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-joint-fit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: bounded synthetic thirteen-parameter closure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          delete-old-caches: 'false'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          julia --project=numerics -e 'using Pkg; Pkg.instantiate()'
      - name: Fit and independently audit fixed synthetic observations
        run: |
          snakemake --snakefile workflow/bounded-joint-fit.smk --cores 1 \
            --config run_dir=runs/ci-bounded algorithm=LN_BOBYQA maxeval=20000
          python scripts/check_cached_bounded_workflow.py runs/ci-bounded \
            --algorithm LN_BOBYQA --maxeval 20000
      - name: Upload scoped evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-joint-fit-${{ github.sha }}
          path: runs/ci-bounded
          retention-days: 30
