name: KPSY paper partial moments

on:
  pull_request:
    paths:
      - config/*-contract.json
      - config/parton-sources.json
      - numerics/**
      - fortran/hoppet_bridge.f90
      - bridges/lhapdf.cpp
      - src/collinsflow/parton.py
      - src/collinsflow/hoppet.py
      - src/collinsflow/provenance.py
      - scripts/prepare_kpsy_paper.py
      - scripts/prepare_hoppet.py
      - scripts/prepare_parton_inputs.py
      - requirements.lock
      - .github/workflows/kpsy-paper-moments.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kpsy-paper-moments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          delete-old-caches: 'false'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          julia --project=numerics -e 'using Pkg; Pkg.instantiate()'
      - name: Verify the exact primary paper bytes and numerical anchors
        run: python scripts/prepare_kpsy_paper.py
      - name: Build unchanged pinned native and physical inputs
        run: |
          python scripts/prepare_hoppet.py
          python scripts/prepare_parton_inputs.py
      - name: Compare the two partial moments under the frozen scientific contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/ci-paper-moments
          julia --project=numerics numerics/bin/check_kpsy_paper_moments.jl .runtime/hoppet/build.json .runtime/parton-inputs/build.json .runtime/paper-moments/source/1505.05589v1.html runs/ci-paper-moments/validation.json | tee runs/ci-paper-moments/job.log
      - name: Retain failures, primary source, build metadata and the compiled bridge
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kpsy-paper-moments-${{ github.sha }}
          path: |
            runs/ci-paper-moments
            .runtime/paper-moments/source/1505.05589v1.html
            .runtime/paper-moments/source/1505.05589v1.receipt.json
            .runtime/hoppet/build.json
            .runtime/hoppet/build.log
            .runtime/hoppet/upstream-tests.log
            .runtime/hoppet/libcollins_hoppet.so
            .runtime/parton-inputs/build.json
            .runtime/parton-inputs/build.log
            .runtime/parton-inputs/bin/libcollins_lhapdf.so
          include-hidden-files: true
          retention-days: 30
