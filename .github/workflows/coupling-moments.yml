name: Coupling partial moment sensitivity

on:
  pull_request:
    paths:
      - config/*-contract.json
      - config/parton-sources.json
      - numerics/**
      - fortran/hoppet_bridge.f90
      - fortran/native_coupling_reference.f90
      - bridges/lhapdf.cpp
      - src/collinsflow/parton.py
      - src/collinsflow/hoppet.py
      - src/collinsflow/provenance.py
      - scripts/prepare_kpsy_paper.py
      - scripts/prepare_native_coupling.py
      - scripts/prepare_hoppet.py
      - scripts/prepare_parton_inputs.py
      - workflow/coupling-moments.smk
      - requirements.lock
      - .github/workflows/coupling-moments.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coupling-moments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          delete-old-caches: 'false'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          julia --project=numerics -e 'using Pkg; Pkg.instantiate()'
      - name: Build pinned comparator and physical inputs
        run: |
          python scripts/prepare_native_coupling.py
          python scripts/prepare_parton_inputs.py
      - name: Run source-bound numerical controls and physical sensitivity
        run: snakemake --snakefile workflow/coupling-moments.smk --cores 1 --printshellcmds --config run_dir=runs/ci-coupling-moments
      - name: Preserve scientific failures and complete native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coupling-moments-${{ github.sha }}
          path: |
            runs/ci-coupling-moments
            .snakemake/log
            .runtime/native-coupling/build.json
            .runtime/native-coupling/build.log
            .runtime/native-coupling/upstream-tests.log
            .runtime/native-coupling/native_coupling_reference
            .runtime/native-coupling/libcollins_hoppet.so
            .runtime/native-coupling/paper.html
            .runtime/native-coupling/paper.receipt.json
            .runtime/parton-inputs/build.json
            .runtime/parton-inputs/build.log
            .runtime/parton-inputs/bin/libcollins_lhapdf.so
          include-hidden-files: true
          retention-days: 30
