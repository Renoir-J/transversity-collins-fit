name: SIDIS recovery software

on:
  push:
    branches: [fix/sidis-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-software:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12.6'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          julia --project=numerics -e 'using Pkg; Pkg.instantiate()'
      - name: Python and repository checks
        run: |
          ruff check src tests scripts/run_sidis_recovery.py
          python -m pytest -q
          python scripts/plan_workflow.py validate
          python scripts/check_repository.py
      - name: Julia tests with explicitly synthetic recovery fixtures
        run: |
          mkdir -p runs/recovery-software
          set -o pipefail
          julia --startup-file=no --project=numerics numerics/test/runtests.jl | tee runs/recovery-software/julia-base.log
          julia --startup-file=no --project=numerics numerics/test/sidis_continuation_tests.jl | tee runs/recovery-software/julia-continuation.log
          julia --startup-file=no --project=numerics numerics/test/sidis_recovery_path_tests.jl | tee runs/recovery-software/julia-paths.log
          julia --startup-file=no --project=numerics numerics/test/sidis_recovery_tests.jl | tee runs/recovery-software/julia-recovery.log
          julia --startup-file=no --project=numerics numerics/test/sidis_retained_entrypoint_tests.jl | tee runs/recovery-software/julia-retained-entrypoint.log
      - name: Synthetic Snakemake closure and cached tamper rejection
        run: |
          snakemake --snakefile workflow/Snakefile --cores 2 --config mode=closure run_dir=runs/recovery-software/closure
          python scripts/check_cached_workflow.py runs/recovery-software/closure
      - name: Upload synthetic software evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-sidis-recovery-software-${{ github.sha }}
          path: runs/recovery-software
          retention-days: 30
