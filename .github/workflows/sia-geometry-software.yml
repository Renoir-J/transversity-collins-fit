name: Synthetic SIA geometry software checks

on:
  push:
    branches: [feat/sia72-geometry, feat/sia72-execution]
  pull_request:
    paths:
      - numerics/bin/SIAGeometry*.jl
      - numerics/bin/SIASourceControls.jl
      - numerics/bin/SIAJobBindings.jl
      - numerics/bin/run_sia_source_controls.jl
      - numerics/bin/audit_sia_source_controls.jl
      - numerics/test/sia_geometry*.jl
      - numerics/test/sia_source_control_tests.jl
      - src/collinsflow/sia_*.py
      - scripts/plan_sia_geometry_jobs.py
      - scripts/run_sia_source_controls.py
      - tests/test_sia_*.py
      - .github/workflows/sia-geometry-software.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-sia-geometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    name: synthetic software and closure only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          delete-old-caches: 'false'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          julia --project=numerics -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Source and Python checks
        run: |
          ruff check src tests scripts/plan_sia_geometry_jobs.py scripts/run_sia_source_controls.py
          python -m pytest -q
          python scripts/plan_workflow.py validate
          python scripts/check_repository.py
      - name: Julia synthetic source and geometry checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/ci-sia-geometry-software
          for test in numerics/test/runtests.jl numerics/test/sia_geometry_selection_tests.jl numerics/test/sia_source_control_tests.jl numerics/test/sia_geometry_model_tests.jl numerics/test/sia_geometry_native_tests.jl numerics/test/sia_geometry_reference_tests.jl; do
            julia --startup-file=no --project=numerics "$test" 2>&1 | tee "runs/ci-sia-geometry-software/$(basename "$test" .jl).log"
          done
      - name: Synthetic closure and cache rejection checks
        run: |
          snakemake --snakefile workflow/Snakefile --cores 2 --config run_dir=runs/ci-sia-geometry-software/closure mode=closure
          python scripts/check_cached_workflow.py runs/ci-sia-geometry-software/closure
      - name: Upload synthetic software evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-sia-geometry-software-${{ github.sha }}
          path: runs/ci-sia-geometry-software
          retention-days: 30
