name: Joint likelihood validation

on:
  pull_request:
    paths:
      - config/*-contract.json
      - config/*-sources.json
      - numerics/**
      - bridges/**
      - fortran/hoppet_bridge.f90
      - fortran/check_dss*.f90
      - src/collinsflow/parton.py
      - src/collinsflow/hoppet.py
      - src/collinsflow/provenance.py
      - scripts/prepare_parton_inputs.py
      - scripts/prepare_hoppet.py
      - scripts/check_cached_joint_workflow.py
      - workflow/joint-likelihood.smk
      - requirements.lock
      - .github/workflows/joint-likelihood.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joint-likelihood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: joint ${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [analytic, inputs]
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          delete-old-caches: 'false'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          julia --project=numerics -e 'using Pkg; Pkg.instantiate()'
      - name: Prepare locked native and parton inputs
        if: matrix.kind == 'inputs'
        run: |
          python scripts/prepare_parton_inputs.py
          python scripts/prepare_hoppet.py
      - name: Validate and independently audit joint profile algebra
        run: |
          snakemake --snakefile workflow/joint-likelihood.smk --cores 1 \
            --config run_dir=runs/ci-joint kind=${{ matrix.kind }}
          python scripts/check_cached_joint_workflow.py runs/ci-joint --kind ${{ matrix.kind }}
      - name: Upload scoped evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joint-likelihood-${{ matrix.kind }}-${{ github.sha }}
          path: |
            runs/ci-joint
            .runtime/hoppet/build.json
            .runtime/hoppet/build.log
            .runtime/hoppet/upstream-tests.log
            .runtime/parton-inputs/build.json
            .runtime/parton-inputs/build.log
          include-hidden-files: true
          retention-days: 30
