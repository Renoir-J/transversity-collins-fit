[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "collinsflow"
version = "0.1.0"
description = "Auditable orchestration for Julia transversity and Collins fits"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "requests>=2.32,<3", "openpyxl>=3.1,<4", "beautifulsoup4>=4.12,<5", "pyyaml>=6,<7"]

[project.optional-dependencies]
workflow = ["snakemake==9.27.1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
collinsflow = "collinsflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

